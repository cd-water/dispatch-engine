# 仅包含本服务特有的配置。其余一切——虚拟线程、actuator 暴露、优雅停机、
# 指标标签——都来自 platform-defaults.yml，它随 platform 模块一起位于 classpath 上。
spring:
  application:
    name: location-service
  config:
    import: "classpath:platform-defaults.yml"

server:
  port: 8081

# 摄取调优。默认值位于 LocationIngestProperties；把这些值放在这里，是为了让压测扫描的
# 参数集中可见，而不是埋在 Java 代码里。
ridematching:
  location:
    min-movement-meters: 25
    max-write-interval: 3s
    max-clock-skew: 30s
    buffer-capacity: 50000
    flush-batch-size: 500
    flush-interval: 50ms
    stale-after: 30s
    reaper-interval: 10s
    city: default
