apiVersion: 1

# 看板以 JSON 形式提交在 ops/grafana/dashboards/ 下，这样 docs/LOAD_TESTING.md 中
# 的压测截图才是可复现的，而不是手工搭建出来的。
providers:
  - name: ride-matching
    orgId: 1
    folder: "Ride Matching"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
