apiVersion: 1

datasources:
  - name: Prometheus
    # 手动固定，而非自动生成。若不显式指定 uid，Grafana 每次安装都会随机生成一个
    # （此处为 PBFA97CFB590B2093），而提交到仓库的看板 JSON 引用的是 "prometheus"——
    # 于是每个面板都指向一个不存在的 datasource，面板自身不报任何错却渲染为空。
    # 只有它引用的 uid 保持稳定，看板才是可移植的。
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
