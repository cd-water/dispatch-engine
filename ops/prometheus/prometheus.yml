global:
  # 5s 与压测的采样分辨率一致：更慢的抓取会抹平延迟尖峰，而发现这些尖峰
  # 正是压测存在的意义。
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 六个服务在 compose 网络内都暴露同一个端点、同一个端口，所以一个带目标列表的
  # job 胜过六个几乎相同的 job。"service" 标签来自 Micrometer 自身的 `application`
  # 标签，由 spring.application.name 设置。
  - job_name: ride-matching
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "dispatch-api:8080"
          - "location-service:8080"
          - "matching-engine:8080"
          - "trip-service:8080"
          - "notification-service:8080"
          - "billing-service:8080"
    relabel_configs:
      # 去掉端口，让 instance 标签显示为 "dispatch-api" 而不是
      # "dispatch-api:8080" ——每个面板图例都更短，看板也保持可读。
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"
