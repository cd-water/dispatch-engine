server:
  port: 8600

spring:
  application:
    name: dispatch-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:dispatch_engine}
    username: ${POSTGRES_USER:dispatchpostgres}
    password: ${POSTGRES_PASSWORD:dispatchpostgres}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dispatchredis}