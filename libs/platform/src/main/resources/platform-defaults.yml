# 所有服务共享的配置。通过显式导入加载，而不是自动加载：
#
#   spring:
#     config:
#       import: "classpath:platform-defaults.yml"
#
# 刻意不命名为 application-common.yml——Spring Boot 会把 "application-<x>.yml" 当作
# profile <x> 的专属文件，于是那个名字会悄悄创建一个并不存在的 "common" profile。
# 这个文件使用中性名称，并被显式导入。
#
# 被导入文档的优先级低于导入它的文件，因此服务可以在自己的 application.yml 中覆盖这里的任何配置。
#
# 保持它只有一个 "spring:" 映射。文件后面再出现第二个顶层 "spring:" 键属于重复键：
# 解析器要么拒绝，要么静默只保留一个分支，从而在一切照常编译的情况下悄悄关闭虚拟线程。

spring:
  threads:
    virtual:
      # ADR-0006。每个请求一个虚拟线程；阻塞式代码，反应式级别的可伸缩性。
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      # acks=all 加幂等：生产者的重试不得悄悄重复或重排记录。代价是 ack 的延迟，
      # 而这部分延迟由发件箱移出了请求路径。
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # earliest：新的消费者组必须看到积压，而不是悄悄跳过它启动前发布的所有内容。
      auto-offset-reset: earliest
      # 偏移量在监听器返回之后才提交，这正是投递语义为至少一次而不是至多一次的原因。
      # 消费者按 eventId 去重。
      enable-auto-commit: false
    listener:
      ack-mode: record

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # 只暴露需要的内容：开放的 actuator 面就是信息泄露。
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      # 从各服务自己的 application.yml 中解析。
      application: ${spring.application.name}

logging:
  level:
    com.ridematching: INFO
