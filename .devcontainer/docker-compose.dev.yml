# Dev Container 覆盖文件。由 devcontainer.json 合并到 ops/docker-compose.yml 之上。
# 新增 VS Code 所连接的 workspace 容器；基础设施服务来自基础文件，因此 `podman compose up`
# 与 Dev Container 使用的是完全相同的 Postgres、Redis 和 Kafka 定义。

services:
  workspace:
    # Java 25 (LTS)。这里运行时行为比语言级别更重要：
    # JDK 24 带来了 JEP 491，消除了 synchronized 上的虚拟线程钉住（pinning）问题。
    image: mcr.microsoft.com/devcontainers/java:25-bookworm

    # 让容器保持存活；VS Code 通过 exec 进入其中。
    command: sleep infinity

    volumes:
      # ":z" 是一次 SELinux 重新打标，在 SELinux 宿主机上是 Podman 所必需的，在其他环境
      # 无害。没有它，在 Fedora/RHEL 上绑定挂载在容器内部将不可读。
      - ..:/workspace:z
      # Maven 仓库使用的命名卷：在重建后得以保留，并避免约 500MB 的依赖下载在每次构建时
      # 跨越 Windows <-> VM 文件系统边界。
      # Podman 创建的这个挂载点归 root 所有，而容器以 vscode 用户运行，因此 post-create.sh
      # 会对它 chown —— 否则第一次运行 mvn 会直接失败。
      # 注意这只对 HOME 为 /home/vscode 的进程有效：不带 --user 的 `podman exec` 以 root
      # 运行，其 Maven 会写入 /root/.m2，并在重建后丢失。
      - maven-repo:/home/vscode/.m2
      # Podman 的 API socket，以 Testcontainers 所期望的 Docker 路径呈现。
      # 这就是 ADR-0007 中承诺的 docker-in-docker 替代方案：测试启动的容器是同一个无根
      # （rootless）引擎下的兄弟节点，而不是嵌套的守护进程。
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:z

    # 在无根（rootless）Podman 下必填。没有它，容器的 root 会映射到宿主机用户，
    # 因此 9p 挂载的 /workspace 上的所有内容在容器看来都是 root:root 0777。
    # 这样 "vscode" 用户（uid 1000）能写入文件内容，却无法对它们调用 utimes()
    # —— POSIX 要求必须拥有所有权才行 —— 而 Maven 的 resources 插件在复制时会保留
    # 时间戳，于是每次构建都会因以下错误而死掉：
    #   "... .imports: Operation not permitted"
    # keep-id 把容器的 uid 1000 映射到宿主机的 uid 1000，而这正是这些文件在 Podman VM 中
    # 真正的所有者，因此 vscode 也拥有它们。它还让下方的 podman.sock 挂载对 vscode 可读，
    # 而不是仅限 root。
    # 仅限 Podman；Docker 会拒绝这个值。
    userns_mode: "keep-id"

    environment:
      # 服务主机名在共享的 compose 网络上解析。应用配置会读取这些值，因此同一份代码在
      # Dev Container 和 CI 中都能工作。
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ride
      SPRING_DATASOURCE_USERNAME: ride
      SPRING_DATASOURCE_PASSWORD: ride
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: UTC

      # Testcontainers 通过上面挂载的 socket 与 Podman 通信。
      DOCKER_HOST: unix:///var/run/docker.sock
      # Ryuk 是 Testcontainers 启动的清理容器，用于在 JVM 崩溃后进行善后。
      # 它需要无根 Podman 不会授予的特权，因此被禁用；容器改为由 JVM 关闭钩子移除。
      # 在开发环境中可以接受，反正这套 compose 服务栈本来就是用完即弃的。
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # 测试启动的容器是本容器的兄弟节点，因此它们发布的端口落在 podman VM 的宿主接口上，
      # 而不是本容器的回环接口。没有这个设置，Testcontainers 会轮询自己的 localhost，
      # 每个容器都会在 60 秒后超时并报 "Timed out waiting for container port to open"。
      # Podman 会把这个名字映射到宿主机。
      TESTCONTAINERS_HOST_OVERRIDE: host.containers.internal

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - ride-net

volumes:
  maven-repo:
